<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" role="img" aria-labelledby="m2t m2d"><title id="m2t">The eight-step route to tembotrione disclosed in CN104292137A</title><desc id="m2d">A linear chain of eight reaction steps from 2-chlorotoluene to tembotrione. Each step box gives the step number, the transformation and the stated yield. Steps flagged as one-pot are marked with a double outline and the word one-pot. Steps whose stated arithmetic does not close are marked with a warning triangle and the word check.</desc><defs><marker id="m2arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker><pattern id="m2hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#5c5c5c" stroke-width="2.2"/></pattern></defs><rect width="1000" height="700" fill="#ffffff"/><text x="500" y="30" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="600" fill="#1a1a1a" text-anchor="middle">CN104292137A, Example 1: eight steps to tembotrione</text><text x="500" y="51" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="normal" fill="#5c5c5c" text-anchor="middle">Yields as printed in the patent. Three steps carry arithmetic that does not close.</text><rect x="34" y="96" width="224" height="96" rx="6" fill="#f4faf7" fill-opacity="1" stroke="#009E73" stroke-width="1.6"/><circle cx="56" cy="118" r="13" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="56" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="160.0" y="122" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">Friedel-Crafts</text><text x="160.0" y="135" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">sulfonylation</text><text x="146.0" y="154" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">MsCl, AlCl3, DCE, 5 C</text><text x="246" y="183" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#009E73" text-anchor="end">84%</text><rect x="276" y="96" width="224" height="96" rx="6" fill="#f4faf7" fill-opacity="1" stroke="#009E73" stroke-width="1.6"/><circle cx="298" cy="118" r="13" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="298" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="402.0" y="122" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">Friedel-Crafts acylation</text><text x="388.0" y="154" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">AcCl, AlCl3, DCM, 15-20 C</text><text x="488" y="183" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#009E73" text-anchor="end">86%</text><rect x="518" y="96" width="224" height="96" rx="6" fill="#fdf3ee" fill-opacity="1" stroke="#D55E00" stroke-width="1.6"/><circle cx="540" cy="118" r="13" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="540" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="644.0" y="122" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">haloform oxidation</text><text x="630.0" y="154" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">NaOCl 15%, THF, reflux</text><text x="730" y="183" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#D55E00" text-anchor="end">72%</text><polygon points="530,186 539,171 548,186" fill="#ffffff" stroke="#D55E00" stroke-width="1.6"/><text x="539" y="183" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" fill="#D55E00" text-anchor="middle">!</text><text x="554" y="183" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#D55E00" text-anchor="start">check</text><rect x="760" y="96" width="224" height="96" rx="6" fill="#f4faf7" fill-opacity="1" stroke="#009E73" stroke-width="1.6"/><circle cx="782" cy="118" r="13" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="782" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="886.0" y="122" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">Fischer esterification</text><text x="872.0" y="154" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">MeOH, pTSA, reflux</text><text x="972" y="183" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#009E73" text-anchor="end">97%</text><rect x="34" y="286" width="224" height="96" rx="6" fill="#fdf3ee" fill-opacity="1" stroke="#D55E00" stroke-width="1.6"/><circle cx="56" cy="308" r="13" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="56" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="160.0" y="312" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">benzylic bromination</text><text x="146.0" y="344" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">Br2, peroxide, CCl4, reflux</text><text x="246" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#D55E00" text-anchor="end">70%</text><polygon points="46,376 55,361 64,376" fill="#ffffff" stroke="#D55E00" stroke-width="1.6"/><text x="55" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" fill="#D55E00" text-anchor="middle">!</text><text x="70" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#D55E00" text-anchor="start">check</text><rect x="276" y="286" width="224" height="96" rx="6" fill="#f4faf7" fill-opacity="1" stroke="#009E73" stroke-width="2.2"/><rect x="280" y="290" width="216" height="88" rx="4" fill="none" fill-opacity="1" stroke="#009E73" stroke-width="1.0"/><circle cx="298" cy="308" r="13" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="298" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="402.0" y="312" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">etherification then</text><text x="402.0" y="325" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">saponification</text><text x="388.0" y="344" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">NaOCH2CF3 / NaOH</text><text x="488" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#009E73" text-anchor="end">92%</text><text x="288" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#009E73" text-anchor="start">one-pot</text><rect x="518" y="286" width="224" height="96" rx="6" fill="#f4faf7" fill-opacity="1" stroke="#009E73" stroke-width="2.2"/><rect x="522" y="290" width="216" height="88" rx="4" fill="none" fill-opacity="1" stroke="#009E73" stroke-width="1.0"/><circle cx="540" cy="308" r="13" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="540" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="644.0" y="312" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">acid chloride then</text><text x="644.0" y="325" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">O-acylation</text><text x="630.0" y="344" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">SOCl2 / cyclohexane-1,3-dione</text><text x="730" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#009E73" text-anchor="end">92%</text><text x="530" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#009E73" text-anchor="start">one-pot</text><rect x="760" y="286" width="224" height="96" rx="6" fill="#fdf3ee" fill-opacity="1" stroke="#D55E00" stroke-width="1.6"/><circle cx="782" cy="308" r="13" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="782" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">8</text><text x="886.0" y="312" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">Fries-type rearrangement</text><text x="872.0" y="344" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">cyanoacetone, Et3N, MeCN</text><text x="972" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#D55E00" text-anchor="end">95%</text><polygon points="772,376 781,361 790,376" fill="#ffffff" stroke="#D55E00" stroke-width="1.6"/><text x="781" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" fill="#D55E00" text-anchor="middle">!</text><text x="796" y="373" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#D55E00" text-anchor="start">check</text><line x1="260" y1="144.0" x2="272" y2="144.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2arrow)"/><line x1="502" y1="144.0" x2="514" y2="144.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2arrow)"/><line x1="744" y1="144.0" x2="756" y2="144.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2arrow)"/><line x1="260" y1="334.0" x2="272" y2="334.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2arrow)"/><line x1="502" y1="334.0" x2="514" y2="334.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2arrow)"/><line x1="744" y1="334.0" x2="756" y2="334.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2arrow)"/><path d="M 872.0 196 L 872.0 220 L 146.0 220 L 146.0 280" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#m2arrow)"/><rect x="754" y="408" width="236" height="46" rx="6" fill="#efe6f1" fill-opacity="1" stroke="#CC79A7" stroke-width="2"/><text x="872.0" y="430" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">tembotrione</text><text x="872.0" y="446" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="normal" fill="#5c5c5c" text-anchor="middle">the target</text><line x1="872.0" y1="386" x2="872.0" y2="404" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2arrow)"/><text x="60" y="466" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="normal" fill="#5c5c5c" text-anchor="start">cumulative yield across all eight steps, as printed:</text><text x="60" y="488" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">0.84 x 0.86 x 0.72 x 0.97 x 0.70 x 0.92 x 0.92 x 0.95  =  28.40%</text><text x="60" y="510" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">A3 produced exactly this for overall_yield_pct, on Example 1 and on the patent-scope pathway.</text><rect x="34" y="595" width="932" height="95" rx="5" fill="#f6f6f6" fill-opacity="1" stroke="#c9c9c9" stroke-width="1"/><text x="44" y="617" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">The three flagged steps are the point of the exercise. Step 3 reports 82 g from 0.24 mol, which exceeds the theoretical</text><text x="44" y="632" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">mass at 100% conversion. Step 5 produces 41.6 g but step 6 charges 55.8 g of it. Step 8 charges 0.5 mol where step 7</text><text x="44" y="647" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">delivered 0.2 mol, and its stated mass and yield disagree. A gold annotation records all of this verbatim and raises</text><text x="44" y="662" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">mass_balance_implausible and scale_discontinuity. It never quietly repairs the patent - an extractor that also fails to</text><text x="44" y="677" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">notice must score as a miss, and it cannot if the reference has been silently corrected.</text></svg>