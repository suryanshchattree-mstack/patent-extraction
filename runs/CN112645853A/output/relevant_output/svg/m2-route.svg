<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" role="img" aria-labelledby="m2t m2d"><title id="m2t">The two-step route to 2-chloro-3-(alkoxymethyl)-4-(methanesulfonyl)benzoic acid disclosed in CN112645853A</title><desc id="m2d">A linear chain of two reaction steps from methyl 2-chloro-3-(bromomethyl)-4-(methanesulfonyl)benzoate to 2-chloro-3-(alkoxymethyl)-4-(methanesulfonyl)benzoic acid. Each step box gives the step number, the transformation and the stated yield. Steps flagged as one-pot are marked with a double outline and the word one-pot. Steps whose stated arithmetic does not close are marked with a warning triangle and the word check.</desc><defs><marker id="m2arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker><pattern id="m2hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#5c5c5c" stroke-width="2.2"/></pattern></defs><rect width="1000" height="700" fill="#ffffff"/><text x="500" y="30" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="600" fill="#1a1a1a" text-anchor="middle">CN112645853A, patent scope: two steps to 2-chloro-3-(alkoxymethyl)-4-(methanesulfonyl)benzoic acid</text><text x="500" y="51" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="normal" fill="#5c5c5c" text-anchor="middle">Yields as printed in the patent. No step carries arithmetic that does not close.</text><rect x="34" y="96" width="224" height="96" rx="6" fill="#f4faf7" fill-opacity="1" stroke="#009E73" stroke-width="1.6"/><circle cx="56" cy="118" r="13" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="56" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="160.0" y="122" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">hydrolysis</text><text x="146.0" y="154" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">sodium hydroxide, potassium</text><text x="146.0" y="166" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">hydroxide, tert-butan...</text><text x="246" y="183" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#009E73" text-anchor="end">no yield</text><rect x="276" y="96" width="224" height="96" rx="6" fill="#f4faf7" fill-opacity="1" stroke="#009E73" stroke-width="1.6"/><circle cx="298" cy="118" r="13" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/><text x="298" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="402.0" y="122" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">Williamson ether</text><text x="402.0" y="135" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.8" font-weight="600" fill="#1a1a1a" text-anchor="middle">synthesis</text><text x="388.0" y="154" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">sodium hydroxide, potassium</text><text x="388.0" y="166" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.3" font-weight="normal" fill="#5c5c5c" text-anchor="middle">hydroxide, acetonitri...</text><text x="488" y="183" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#009E73" text-anchor="end">no yield</text><line x1="260" y1="144.0" x2="272" y2="144.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2arrow)"/><rect x="270" y="218" width="236" height="81" rx="6" fill="#efe6f1" fill-opacity="1" stroke="#CC79A7" stroke-width="2"/><text x="388.0" y="236" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">2-chloro-3-(alkoxymethyl)-</text><text x="388.0" y="253" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">4-(methanesulfonyl)benzoic</text><text x="388.0" y="270" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">acid</text><text x="388.0" y="289" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="normal" fill="#5c5c5c" text-anchor="middle">the target</text><line x1="388.0" y1="196" x2="388.0" y2="214" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2arrow)"/><text x="60" y="311" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="normal" fill="#5c5c5c" text-anchor="start">cumulative yield across all two steps, as printed:</text><text x="60" y="333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">not computable: 2 of 2 steps print no yield</text><text x="60" y="355" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">Generated from pathways.json and reactions.json. No route diagram has been hand-authored for this</text><text x="60" y="369" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">patent.</text><rect x="34" y="610" width="932" height="80" rx="5" fill="#f6f6f6" fill-opacity="1" stroke="#c9c9c9" stroke-width="1"/><text x="44" y="632" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">Every box on this diagram is read out of the gold annotation, not typed beside it: the transformation is the</text><text x="44" y="647" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">reaction's named_reaction or its class, the conditions are its reagents and solvent, the yield is its stated</text><text x="44" y="662" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">product_yield_pct, and a step is flagged when the annotation put a validation_flag on it. Nothing here is a</text><text x="44" y="677" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="normal" fill="#5c5c5c" text-anchor="start">second opinion about the chemistry. For a richer figure, add an entry to HAND_DRAWN_ROUTES in make_svgs.py.</text></svg>